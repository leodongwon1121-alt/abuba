name: Deploy client to GitHub Pages

# 실제 배포는 Render(render.yaml)가 담당한다 — API 서버까지 같이 떠야 앱이 동작하기 때문.
# 이 워크플로는 프론트만 정적으로 미리 보고 싶을 때 수동 실행용으로 남겨둔다.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 동시에 하나만. 진행 중인 건 취소하고 최신 커밋으로 덮어쓴다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        env:
          # 프로젝트 사이트라 https://<user>.github.io/abuba/ 하위에서 서빙된다.
          VITE_BASE_PATH: /abuba/
          # Express 서버는 Pages에 못 올라간다. 별도 호스팅한 API 주소를 시크릿으로 넣을 것.
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      # Pages에는 SPA 폴백이 없다. /market 같은 주소를 새로고침하면 404가 나므로
      # 404.html에 같은 index.html을 두어 react-router가 처리하게 한다.
      - name: SPA fallback
        run: cp client/dist/index.html client/dist/404.html

      # enablement: 저장소 Pages 설정이 꺼져 있으면 자동으로 켜고 소스를 Actions로 맞춘다.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
